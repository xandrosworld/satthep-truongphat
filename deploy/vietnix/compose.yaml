name: truongphat
services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: truongphat-quotation:${TP_RELEASE:-local}
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "4174"
      TP_PUBLIC_ORIGIN: https://${TP_DOMAIN:?Set TP_DOMAIN}
      TP_SETUP_KEY: ${TP_SETUP_KEY:?Set a random TP_SETUP_KEY}
      TP_DATABASE_PATH: /data/truongphat.sqlite
      TP_BACKUP_DIR: /backups
      TP_MAINTENANCE_FILE: /data/maintenance
    volumes:
      - ${TP_DATA_DIR:-/srv/truongphat/data}:/data
      - ${TP_BACKUP_DIR:-/srv/truongphat/backups}:/backups
    expose:
      - "4174"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4174/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      TP_DOMAIN: ${TP_DOMAIN:?Set TP_DOMAIN}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
